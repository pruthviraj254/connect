extends: electron-builder.yml

detectUpdateChannel: false

appId: health.onerx.rxconnect.staging
productName: Rx-Connect Staging
# No spaces — gh release upload and NSIS paths break on "Rx-Connect Staging-Setup-....exe"
artifactName: Rx-Connect-Staging-Setup-${version}-${arch}.${ext}

publish:
  - provider: github
    owner: ${env.GH_OWNER}
    repo: ${env.GH_REPO}
    releaseType: prerelease
    channel: staging
