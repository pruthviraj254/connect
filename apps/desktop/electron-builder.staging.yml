extends: electron-builder.yml

detectUpdateChannel: false

appId: health.onerx.rxmanager.staging
productName: Rx-Manager Staging
# No spaces — gh release upload and NSIS paths break on "Rx-Manager Staging-Setup-....exe"
artifactName: Rx-Manager-Staging-Setup-${version}-${arch}.${ext}

win:
  executableName: rx-manager-staging

nsis:
  shortcutName: Rx-Manager Staging
  menuCategory: OneRx Staging
  uninstallDisplayName: Rx-Manager Staging

publish:
  - provider: github
    owner: ${env.GH_OWNER}
    repo: ${env.GH_REPO}
    releaseType: prerelease
    channel: staging
