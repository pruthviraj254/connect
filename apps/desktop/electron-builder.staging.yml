extends: electron-builder.yml

appId: health.onerx.rxconnect.staging
productName: Rx-Connect Staging
artifactName: ${productName}-Setup-${version}-${arch}.${ext}

publish:
  - provider: github
    owner: ${env.GH_OWNER}
    repo: ${env.GH_REPO}
    releaseType: release

# electron-updater channel → staging.yml / staging-mac.yml
channel: staging
