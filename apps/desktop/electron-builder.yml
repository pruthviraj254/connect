appId: health.onerx.rxmanager
productName: Rx-Manager
artifactName: ${productName}-Setup-${version}-${arch}.${ext}
copyright: Copyright (c) OneRx Inc
# Required with pnpm hoisted monorepos — must match resolved electron in pnpm-lock.yaml.
electronVersion: 33.4.11

directories:
  output: dist
  buildResources: build

files:
  - '**/*'

asar: true
asarUnpack:
  - '**/keytar/**'
npmRebuild: true

win:
  # Must match forge packager executableName — shortcuts/NSIS target the wrong file otherwise.
  executableName: rx-manager
  target:
    - target: nsis
      arch:
        - x64
  publisherName: OneRx Inc
  # Authenticode code signing (removes "Unknown publisher" SmartScreen warning).
  # Provide the certificate at build time via env vars (preferred — no secrets in git):
  #   CSC_LINK             = path to .pfx file OR base64-encoded .pfx contents
  #   CSC_KEY_PASSWORD     = password for the .pfx
  # OR for a cert installed in the Windows certificate store:
  #   WIN_CSC_SUBJECT_NAME = subject name (e.g. "OneRx Inc")
  signingHashAlgorithms:
    - sha256
  signAndEditExecutable: true
  signDlls: false
  rfc3161TimeStampServer: http://timestamp.digicert.com
  verifyUpdateCodeSignature: true

mac:
  target:
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.medical
  hardenedRuntime: true
  gatekeeperAssess: false
  # Signing / notarization at build time (CI secrets):
  #   CSC_LINK, CSC_KEY_PASSWORD — Developer ID Application cert (.p12)
  #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID — notarization

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: Rx-Manager
  uninstallDisplayName: Rx-Manager
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: OneRx
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  include: build/installer.nsh

afterSign: scripts/after-sign.cjs

publish:
  - provider: github
    owner: ${env.GH_OWNER}
    repo: ${env.GH_REPO}
    releaseType: release
