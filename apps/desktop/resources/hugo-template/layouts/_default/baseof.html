<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}{{ .Site.Data.pharmacy.name }}{{ end }}</title>
  {{ with .Site.Data.pharmacy.metaDescription }}
  <meta name="description" content="{{ . }}">
  {{ end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/bootstrap.min.css">
  <style>
    :root {
      --bs-primary: {{ .Site.Params.primaryColor | default "#3a4b8a" }};
      --bs-secondary: {{ .Site.Params.accentColor | default "#2d3a6b" }};
      --bs-body-font-family: 'Montserrat', system-ui, sans-serif;
    }
    body { font-family: var(--bs-body-font-family); }
    .site-header { z-index: 1030; }
    .navbar-brand img { max-height: 52px; width: auto; }
    .brand-initial {
      width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.2); border-radius: .375rem; font-weight: 700; font-size: 1.25rem;
    }
    .navbar-nav .nav-link { font-weight: 600; }
    .navbar-nav .nav-link.active { background: rgba(255,255,255,.2); border-radius: .375rem; }
    .hero-carousel .carousel-item img { width: 100%; height: 340px; object-fit: cover; }
    .hero-placeholder {
      height: 340px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f8f9fa, #e9ecef); font-size: 3rem;
    }
    .service-icon-img { width: 90px; height: 90px; object-fit: contain; border-radius: 10px; }
    .service-emoji {
      width: 90px; height: 90px; margin: 0 auto; display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; background: #fff; border-radius: 10px; box-shadow: 0 .25rem .75rem rgba(0,0,0,.08);
    }
    .img-wide {
      height: 140px;
      background: linear-gradient(rgba(58,75,138,.06), rgba(58,75,138,.02));
    }
    .gallery-scroll { overflow-x: auto; }
    .gallery-row { display: flex; gap: 1rem; width: max-content; padding: .5rem 0; }
    .gallery-row img { height: 200px; border-radius: .5rem; object-fit: cover; }
    .footer-logo { max-height: 100px; width: auto; }
    .map-embed iframe { display: block; width: 100%; min-height: 400px; border: 0; }
  </style>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="/vendor/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
