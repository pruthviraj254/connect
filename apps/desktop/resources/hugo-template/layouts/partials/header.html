{{ $p := .Site.Data.pharmacy }}
<header class="site-header sticky-top shadow">
  <div  class="topbar text-white" style="background-color: var(--bs-primary);">
    <div class="container py-2">
      <div class="d-flex flex-wrap justify-content-end align-items-center gap-3 small fw-medium">
        {{ with $p.phone }}
        <a href="tel:{{ . }}" class="link-light text-decoration-none d-inline-flex align-items-center gap-2">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.678.678 0 0 0 .178.643l2.457 2.457a.678.678 0 0 0 .644.178l2.189-.547a1.745 1.745 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.634 18.634 0 0 1-7.01-4.42 18.634 18.634 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877L1.885.511z"/></svg>
          {{ . }}
        </a>
        {{ end }}
        {{ with $p.email }}
        <a href="mailto:{{ . }}" class="link-light text-decoration-none d-inline-flex align-items-center gap-2">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555zM0 4.697v7.104l5.803-3.558L0 4.697zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757zm3.436-.586L16 11.801V4.697l-5.803 3.546z"/></svg>
          {{ . }}
        </a>
        {{ end }}
      </div>
    </div>
  </div>
  <nav class="navbar navbar-expand navbar-dark" style="background-color: var(--bs-primary);">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 me-auto" href="/">
        {{ with $p.logoUrl }}
        <img src="{{ . }}" alt="{{ $p.name }}">
        {{ else }}
        <span class="brand-initial">{{ substr $p.name 0 1 }}</span>
        {{ end }}
        <span class="fw-bold lh-sm d-none d-sm-inline">{{ $p.name }}</span>
      </a>
      <ul class="navbar-nav flex-row flex-wrap">
        {{ range .Site.Menus.main }}
        <li class="nav-item">
          <a
            href="{{ .URL }}"
            class="nav-link px-3{{ if $.IsMenuCurrent "main" . }} active fw-bold{{ else if $.HasMenuCurrent "main" . }} active fw-bold{{ end }}"
          >{{ .Name }}</a>
        </li>
        {{ end }}
      </ul>
    </div>
  </nav>
</header>
