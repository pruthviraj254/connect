# Builds the production macOS ZIP on main (artifact only — no GitHub Release).
# Publish to Releases: tag v* → release-desktop.yml
name: Build desktop (macOS)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-desktop-macos.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-desktop-macos.yml'

concurrency:
  group: desktop-macos-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_OWNER: ${{ vars.GH_OWNER || github.repository_owner }}
  GH_REPO: ${{ vars.GH_REPO || 'connect' }}
  RX_CONNECT_CHANNEL: production
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || 'https://portal-api.myonerx.com/api' }}
  NEXT_PUBLIC_RX_CONNECT_INGEST_SECRET: ${{ secrets.RX_CONNECT_INGEST_SECRET }}

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Build shared package
        run: pnpm --filter @rx-connect/shared run build

      - name: Build renderer (production)
        run: pnpm --filter @rx-connect/desktop run build:renderer

      - name: Vendor Hugo (macOS arm64)
        run: node apps/desktop/scripts/download-hugo.cjs --platform=current

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Go mod tidy (print service)
        run: cd services/print-service && go mod tidy

      - name: Build macOS print service
        run: node apps/desktop/scripts/build-print-service.cjs

      - name: Build production macOS ZIP
        run: pnpm --filter @rx-connect/desktop run dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Validate production updater metadata
        run: |
          if [ ! -f apps/desktop/dist/latest-mac.yml ]; then
            echo "latest-mac.yml was not generated."
            exit 1
          fi

      - name: List build output
        run: ls -laR apps/desktop/dist

      - name: Upload production macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx-connect-macos-prod-${{ github.run_number }}
          path: |
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.zip.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 30
