# Builds the staging Windows NSIS installer on dev (artifact only — no GitHub Release).
# Publish to Releases: tag staging-v* → release-desktop-staging.yml
name: Build desktop (Windows, staging)

on:
  workflow_dispatch:
  push:
    branches: [dev, develop]
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-desktop-windows-staging.yml'
  pull_request:
    branches: [dev, develop]
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-desktop-windows-staging.yml'

concurrency:
  group: desktop-windows-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_OWNER: ${{ vars.GH_OWNER || github.repository_owner }}
  GH_REPO: ${{ vars.GH_REPO || 'connect' }}
  RX_CONNECT_CHANNEL: staging
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || 'https://api.staging.onerx.com' }}

jobs:
  build-windows-staging:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Build shared package
        run: pnpm --filter @rx-connect/shared run build

      - name: Build renderer (staging)
        run: pnpm --filter @rx-connect/desktop run build:renderer:staging

      - name: Vendor Ghostscript (Windows x64)
        run: node apps/desktop/scripts/vendor-ghostscript-win.cjs

      - name: Vendor Hugo (Windows x64)
        run: node apps/desktop/scripts/download-hugo.cjs --platform=win32

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Go mod tidy (print service)
        run: cd services/print-service && go mod tidy

      - name: Build Windows print service
        run: node apps/desktop/scripts/build-print-service.cjs

      - name: Build staging Windows installer (NSIS)
        run: pnpm --filter @rx-connect/desktop run dist:win:staging
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_SUBJECT_NAME: ${{ secrets.WIN_CSC_SUBJECT_NAME }}

      - name: Validate staging updater metadata
        shell: pwsh
        run: |
          if (-not (Test-Path apps/desktop/dist/staging.yml)) {
            throw 'staging.yml was not generated.'
          }

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse apps/desktop/dist | Select-Object FullName, Length

      - name: Upload staging installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx-connect-windows-staging-${{ github.run_number }}
          path: |
            apps/desktop/dist/Rx-Connect-Staging-Setup-*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/staging.yml
          if-no-files-found: error
          retention-days: 30
