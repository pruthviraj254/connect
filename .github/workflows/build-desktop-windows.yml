# Builds the Windows NSIS installer + electron-updater metadata (cannot be produced on macOS).
# Artifacts: Rx-Connect-Setup-*.exe, latest.yml, *.blockmap
name: Build desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-desktop-windows.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-desktop-windows.yml'

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Build shared package (fresh dist for CI)
        run: pnpm --filter @rx-connect/shared run build

      - name: Build renderer (includes pdf.js worker for preview)
        run: pnpm --filter @rx-connect/desktop run build:renderer

      - name: Vendor Ghostscript (Windows x64, bundled in installer)
        run: node apps/desktop/scripts/vendor-ghostscript-win.cjs

      - name: Vendor Hugo (Windows x64, bundled for website preview)
        run: node apps/desktop/scripts/download-hugo.cjs --platform=win32

      - name: Build Windows installer (NSIS)
        run: pnpm --filter @rx-connect/desktop run dist:win

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse apps/desktop/dist | Select-Object FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx-connect-windows-${{ github.run_number }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  publish-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Build shared package
        run: pnpm --filter @rx-connect/shared run build

      - name: Build renderer
        run: pnpm --filter @rx-connect/desktop run build:renderer

      - name: Vendor Ghostscript
        run: node apps/desktop/scripts/vendor-ghostscript-win.cjs

      - name: Vendor Hugo (Windows x64)
        run: node apps/desktop/scripts/download-hugo.cjs --platform=win32

      - name: Build and publish to GitHub Releases
        run: pnpm --filter @rx-connect/desktop run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
